name: Tag New Version

on:
    push:
        branches:
            - main
        paths:
            - "CHANGELOG.md"

jobs:
    tag-version:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.10"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install setuptools setuptools_scm

            - name: Check if new version in changelog
              id: check_version
              run: |
                  # Extract the latest version from CHANGELOG.md
                  VERSION=$(grep -E "^## \[[0-9]+\.[0-9]+\.[0-9]+\]" CHANGELOG.md | head -1 | sed -E 's/## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/')
                  echo "VERSION=$VERSION" >> $GITHUB_ENV
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

                  # Check if tag already exists
                  if git tag -l | grep -q "^v$VERSION$"; then
                    echo "Tag v$VERSION already exists"
                    echo "create_tag=false" >> $GITHUB_OUTPUT
                  else
                    echo "New version found: $VERSION"
                    echo "create_tag=true" >> $GITHUB_OUTPUT
                  fi

            - name: Create tag
              if: steps.check_version.outputs.create_tag == 'true'
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  git tag -a "v${{ env.VERSION }}" -m "Version ${{ env.VERSION }}"
                  git push origin "v${{ env.VERSION }}"

            - name: Create GitHub Release
              if: steps.check_version.outputs.create_tag == 'true'
              uses: softprops/action-gh-release@v1
              with:
                  name: "Version ${{ steps.check_version.outputs.version }}"
                  tag_name: "v${{ steps.check_version.outputs.version }}"
                  generate_release_notes: true